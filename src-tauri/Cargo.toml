[package]
name = "unote"
version = "0.1.0"
description = "Local-first Markdown notes synced with Git"
authors = ["you"]
edition = "2021"

[lib]
name = "unote_lib"
crate-type = [
  "staticlib",
  "cdylib",
  "rlib"
]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
base64 = "0.22"
rand = "0.8"
git2 = "0.19"
dotenvy = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "native-tls"] }
urlencoding = "2"
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "sync-secret-service"] }
tempfile = "3"

[dev-dependencies]

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
